[package]
name = "puck-addon-stalekind"
version = "0.1.0"
edition = "2021"
description = "Malformed-input guest, never shipped: declares a channel descriptor whose Kind byte (4) names no AddonChannelKind member, so the host refuses it at handshake by the ordinary undefined-kind refusal."
publish = false

# cdylib, not rlib — see puck-addon-queryspam/src/lib.rs's module doc for why the frozen puck_* ABI
# exports live in the crate that actually produces the .wasm.
[lib]
crate-type = ["cdylib"]

[dependencies]
puck-stdlib = { path = "../puck-stdlib" }
