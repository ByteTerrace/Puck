description: Install this run's candidate Puck CLI into .tmp/puck-ci from a downloaded artifact, a local package directory, or a pack of this checkout, and export it on PATH.
inputs:
  azure:
    default: "false"
    description: Install this run's Azure CLI release-host extension in the workspace extensions directory.
  artifact:
    default: ""
    description: The name of this run's artifact holding the ByteTerrace.Puck.Cli package; downloaded, never compiled.
  directory:
    default: ""
    description: A local directory already holding the ByteTerrace.Puck.Cli package.
name: Install Puck CLI
runs:
  steps:
    - if: inputs.azure == 'true'
      name: Install the candidate Azure CLI extension
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: cli-azure-extension
        path: extensions
    - name: Install firmware and addon toolchains
      uses: ./.github/actions/setup-toolchains
    - if: inputs.artifact != ''
      name: Download the candidate CLI package
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: ${{ inputs.artifact }}
        path: artifacts/cli-feed
    - env:
        DIRECTORY: ${{ inputs.artifact != '' && 'artifacts/cli-feed' || inputs.directory }}
      name: Install the candidate CLI in isolation
      run: |
        set -euo pipefail
        tool=.tmp/puck-ci
        if [[ -z "$DIRECTORY" ]]; then
          DIRECTORY=.tmp/puck-pack
          dotnet restore src/Puck.Cli --locked-mode
          dotnet pack src/Puck.Cli -c Release --no-restore --output "$DIRECTORY"
        fi
        MSBUILDDISABLENODEREUSE=1 dotnet run --file build/CandidateCliInstall.cs -c Release -- "$DIRECTORY" "$tool"
        echo "$GITHUB_WORKSPACE/$tool" >> "$GITHUB_PATH"
      shell: bash
  using: composite
