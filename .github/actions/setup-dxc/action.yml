description: Install the checksum-pinned DirectX Shader Compiler the shader projects compile with, and export its bin directory.
name: Install pinned DXC
runs:
  steps:
    - name: Download, verify, and extract DXC
      run: |
        set -euo pipefail
        version=v1.9.2607
        destination=.tmp/dxc
        if [[ -e "$destination" ]]; then echo "Use a fresh DXC directory: $destination" >&2; exit 1; fi
        if [[ "$RUNNER_OS" == Windows ]]; then
          asset=dxc_2026_07_29.zip
          expected=a1dfb116ba3eeae6a1582291b53a8e7bf65ad760676bd3194685c8f7367cd241
          bin=$destination/bin/x64
        else
          asset=linux_dxc_2026_07_29.x86_x64.tar.gz
          expected=55665c87824051ed4774ff3280a79ccbbb7d39243b9736ca5e98222134112d54
          bin=$destination/bin
        fi
        mkdir -p "$destination"
        curl --fail --silent --show-error --location --output "$destination/$asset" "https://github.com/microsoft/DirectXShaderCompiler/releases/download/$version/$asset"
        echo "$expected  $destination/$asset" | sha256sum --check --quiet
        if [[ "$asset" == *.zip ]]; then 7z x -y -o"$destination" "$destination/$asset" > /dev/null; else tar -xzf "$destination/$asset" -C "$destination" --strip-components=1; fi
        "$bin/dxc" --version
        echo "$GITHUB_WORKSPACE/$bin" >> "$GITHUB_PATH"
      shell: bash
  using: composite
