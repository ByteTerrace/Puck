name: Check source formatting
run-name: Formatting check — ${{ github.head_ref || github.ref_name }}

on:
  pull_request:
  workflow_dispatch:
    inputs:
      base:
        description: Full base commit SHA used to select the changed source files
        required: true
        type: string

permissions:
  contents: read

concurrency:
  cancel-in-progress: true
  group: format-${{ github.event.pull_request.number || github.ref }}

env:
  CI: true
  DOTNET_NOLOGO: true

jobs:
  prepare:
    name: Prepare formatting
    outputs:
      changed: ${{ steps.format.outputs.changed }}
    runs-on: windows-2025
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install the pinned .NET SDK
        uses: ./.github/actions/setup-dotnet
        with:
          cache: "true"
      - name: Install WebAssembly tools
        run: dotnet workload install wasm-tools
      - name: Install pinned DXC
        uses: ./.github/actions/setup-dxc
      - name: Restore and build semantic context
        run: |
          dotnet restore Puck.slnx --locked-mode
          dotnet build Puck.slnx -c Release --no-restore
      - name: Package the already-compiled candidate formatter
        run: dotnet pack src/Puck.Cli -c Release --no-build --no-restore -o artifacts/formatter-cli
      - name: Install the candidate formatter
        uses: ./.github/actions/setup-puck
        with:
          directory: artifacts/formatter-cli
      - name: Test formatter safety
        run: dotnet test tests/Puck.Cli.Tests -c Release --no-build --no-restore --filter FullyQualifiedName~Format
      - env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.base }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        id: format
        name: Format the PR's changed C# files and verify convergence
        run: puck format ci "$BASE_SHA" "$HEAD_SHA" artifacts/format
        shell: bash
      - if: steps.format.outputs.changed == 'true'
        name: Compile the formatted result
        run: dotnet build Puck.slnx -c Release --no-restore
      - name: Upload the formatting patch
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: puck-format
          path: artifacts/format
          retention-days: 7
    timeout-minutes: 60
  check:
    if: always()
    name: Formatting
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
      - env:
          CHANGED: ${{ needs.prepare.outputs.changed }}
          RESULT: ${{ needs.prepare.result }}
        name: Require clean formatting on this commit
        run: |
          if [[ "$RESULT" != success || "$CHANGED" != false ]]; then
            echo 'Formatting is not clean on this commit. See Prepare formatting and the puck-format artifact.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
