name: Format

on:
  pull_request:
  workflow_dispatch:
    inputs:
      base:
        description: PR base commit to compare against
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: format-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: true
  DOTNET_NOLOGO: true

jobs:
  prepare:
    name: Prepare formatting
    runs-on: windows-2025
    timeout-minutes: 60
    outputs:
      changed: ${{ steps.format.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Install WebAssembly tools
        run: dotnet workload install wasm-tools
      - uses: ./.github/actions/setup-puck
        with:
          # The formatter's rules are part of the source under review.
          candidate: true
      - name: Restore and build semantic context
        run: |
          dotnet restore Puck.slnx --locked-mode
          dotnet build Puck.slnx -c Release --no-restore
      - name: Test formatter safety
        run: dotnet test tests/Puck.Cli.Tests -c Release --no-build --no-restore --filter FullyQualifiedName~Format
      - name: Format the PR's changed C# files and verify convergence
        id: format
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.base }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: puck format ci "$BASE_SHA" "$HEAD_SHA" artifacts/format
      - name: Compile the formatted result
        run: dotnet build Puck.slnx -c Release --no-restore
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: puck-format
          path: artifacts/format
          if-no-files-found: error
          retention-days: 7

  check:
    name: Formatting
    if: always()
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
      - name: Require clean formatting on this commit
        env:
          RESULT: ${{ needs.prepare.result }}
          CHANGED: ${{ needs.prepare.outputs.changed }}
        run: |
          if [[ "$RESULT" != success || "$CHANGED" != false ]]; then
            echo 'Formatting is not clean on this commit. See Prepare formatting and the puck-format artifact.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
