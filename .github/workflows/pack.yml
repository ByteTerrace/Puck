name: Pack

# Builds the blessed NuGet packages (ByteTerrace.Puck.Abstractions, .Maths,
# .Assets, .Commands, .Attestation, .Hosting, .Physics) and uploads them as a
# build artifact. Every package a blessed package depends on must itself be in
# the loop: .Commands and .Hosting declare a dependency on .Assets, so a loop
# without .Assets ships packages nobody can restore. The package version is
# whatever build/Packaging.targets declares — the single source of truth. Runs
# on every change for validation, and is called by publish.yml so the exact
# bytes that were validated are the bytes that get pushed.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pack-pr-{0}', github.ref) || format('pack-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Pack blessed projects
        run: |
          for project in src/Puck.Abstractions src/Puck.Maths src/Puck.Assets src/Puck.Commands src/Puck.Attestation src/Puck.Hosting src/Puck.Physics; do
            dotnet pack "$project" --configuration Release --output artifacts/packages
          done
          ls -l artifacts/packages

      - uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
          if-no-files-found: error
