name: Build release artifacts

on:
  workflow_call:

permissions:
  contents: read

env:
  CI: true
  DOTNET_NOLOGO: true

jobs:
  windows:
    name: Compile and package .NET payloads (Windows)
    runs-on: windows-2025
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned .NET SDK
        uses: ./.github/actions/setup-dotnet
        with:
          cache: "true"
      - name: Install WebAssembly tools
        run: dotnet workload install wasm-tools
      - name: Install pinned DXC
        uses: ./.github/actions/setup-dxc
      - name: Restore locked dependencies
        run: dotnet restore Puck.slnx --locked-mode
      - name: Compile the platform bootstrap program without running it
        run: dotnet build src/Puck.Azure.Resources/bootstrap.cs -c Release
      - name: Compile the solution once
        run: dotnet build Puck.slnx -c Release --no-restore -p:PuckCaptureTestArtifacts=true -bl:artifacts/build.binlog
      - name: Package the compiled assemblies without rebuilding
        run: dotnet src/Puck.Cli/bin/Release/net10.0/Puck.Cli.dll nuget pack artifacts/packages --no-build
      - name: Publish the compiled Functions and browser payloads
        run: |
          dotnet publish src/Puck.Azure.Functions -c Release --no-build --no-restore -o artifacts/runtime/functions
          dotnet publish src/Puck.World.Browser -c Release --no-build --no-restore
          dotnet publish src/Puck.World -c Release --no-build --no-restore -o artifacts/world
      - name: Capture compiled outputs and their source identity
        run: dotnet src/Puck.Cli/bin/Release/net10.0/Puck.Cli.dll artifacts capture
      - name: Upload compiled Windows assemblies
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          compression-level: 0
          if-no-files-found: error
          name: compiled-windows
          path: artifacts/compiled-windows.zip
      - name: Upload NuGet packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          compression-level: 0
          if-no-files-found: error
          name: nuget-packages
          path: artifacts/packages/*.*nupkg
      - name: Upload the compiled Roslyn analyzers
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: compiler-analyzers
          path: src/Puck.Analyzers/bin/Release/netstandard2.0
      - name: Upload Functions and browser payloads
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          include-hidden-files: true
          name: runtime-payloads
          path: artifacts/runtime
      - name: Upload HGB and AGB binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: emulator-batteries
          path: artifacts/batteries
      - name: Upload World test assemblies
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: world-verification
          path: artifacts/world-tests
      - name: Upload the World desktop build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: world-windows-framework-dependent
          path: artifacts/world
      - if: always()
        name: Upload build diagnostics
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          compression-level: 0
          if-no-files-found: warn
          name: build-diagnostics
          path: artifacts/build.binlog
    timeout-minutes: 60
