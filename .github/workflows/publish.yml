name: Release & publish

# The version in build/Packaging.targets is the single source of truth. Bump
# <Version> there and merge to main; this workflow reads it, and if no GitHub
# Release exists for it yet, validates (build.yml + verify.yml), packs (pack.yml), pushes to
# NuGet.org, then generates the tag + release. Unchanged version => the release
# already exists => the run is a no-op. A failed run is safe to retry because
# duplicate NuGet packages are skipped and the release is the completion marker.
#
# Everything happens in one run on purpose: a release created by the Actions
# token does NOT trigger a separate "release" workflow, so tag/release and the
# push cannot be split across workflows without a stored PAT — which would
# defeat the point of Trusted Publishing.
#
# Authentication is NuGet Trusted Publishing (OIDC) — no stored API key. The
# push is gated by the 'NuGet' environment the policy is bound to. This file
# must stay named publish.yml: the trusted-publishing policy matches on it.

on:
  push:
    branches: [main]
    paths: [build/Packaging.targets]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nuget-publish
  cancel-in-progress: false
  queue: max

jobs:
  gate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      release: ${{ steps.read.outputs.release }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - id: read
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' build/Packaging.targets | head -n1 | tr -d '\r')
          if [ -z "$version" ]; then
            echo "::error::No <Version> found in build/Packaging.targets" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          tag="v$version"
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" >release.json 2>release-error.txt; then
            echo "Release $tag already exists — nothing to publish."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! grep -q 'HTTP 404' release-error.txt; then
            cat release-error.txt >&2
            exit 1
          fi
          # An unfinished tag must never label packages from another commit.
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            if [ "$(git rev-parse "$tag^{commit}")" != "$GITHUB_SHA" ]; then
              echo "::error::Tag $tag points to another commit without a completed release."
              exit 1
            fi
          fi
          echo "release=true" >> "$GITHUB_OUTPUT"

  pack:
    needs: gate
    if: needs.gate.outputs.release == 'true'
    uses: ./.github/workflows/pack.yml

  build:
    needs: gate
    if: needs.gate.outputs.release == 'true'
    uses: ./.github/workflows/build.yml

  verify:
    needs: gate
    if: needs.gate.outputs.release == 'true'
    permissions:
      contents: read
      checks: write
    uses: ./.github/workflows/verify.yml

  publish:
    needs: [gate, pack, build, verify]
    if: needs.gate.outputs.release == 'true'
    runs-on: ubuntu-latest
    # id-token: write lets NuGet/login exchange the run's OIDC token for a
    # short-lived key. The environment name MUST match the trusted-publishing
    # policy ('NuGet'); add protection rules there to gate publishes on
    # approval.
    permissions:
      contents: read
      id-token: write
    environment:
      name: NuGet
      url: https://www.nuget.org/profiles/ByteTerrace
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nuget-packages
          path: packages

      - name: NuGet login (Trusted Publishing)
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: ByteTerrace

      - name: Push to NuGet.org
        run: >
          dotnet nuget push "packages/*.nupkg"
          --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

  release:
    needs: [gate, publish]
    if: needs.gate.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # reuse an incomplete run's tag if one already exists

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          tag="v$VERSION"
          prerelease=()
          case "$VERSION" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$tag" \
            --target "$GITHUB_SHA" \
            --title "$tag" \
            --generate-notes \
            "${prerelease[@]}"
          echo "Created release $tag"

  docs:
    needs: release
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/docs.yml
