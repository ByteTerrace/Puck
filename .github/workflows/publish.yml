name: Release NuGet packages
run-name: NuGet ${{ inputs.publish && 'publication' || 'validation' }} — ${{ inputs.packages }} — ${{ github.ref_name }}

# A version bump alone does not publish. Choose the batch explicitly; see docs/development/ci.md.
# Keep this filename and the NuGet environment aligned with Trusted Publishing.
on:
  workflow_dispatch:
    inputs:
      packages:
        default: all
        description: "Package selection: all, or full IDs separated by commas (for example ByteTerrace.Puck.Maths)"
        required: true
        type: string
      publish:
        default: false
        description: Publish the verified packages to NuGet.org (false validates and prepares artifacts only)
        required: true
        type: boolean

permissions:
  contents: read

concurrency:
  cancel-in-progress: false
  group: nuget-publish
  queue: max

env:
  CI: true
  DOTNET_NOLOGO: true

jobs:
  artifacts:
    name: Build .NET artifacts
    uses: ./.github/workflows/artifacts.yml
  pack:
    name: Verify package installation
    needs: artifacts
    uses: ./.github/workflows/pack.yml
    with:
      prebuilt: true
  build:
    name: Test .NET artifacts
    needs: artifacts
    uses: ./.github/workflows/build.yml
    with:
      prebuilt: true
  verify:
    name: Verify runtime artifacts
    needs: artifacts
    uses: ./.github/workflows/verify.yml
    with:
      prebuilt: true
  docs:
    name: Build API documentation
    needs: artifacts
    uses: ./.github/workflows/docs.yml
    with:
      prebuilt: true
  prepare:
    name: Validate the release source and prepare the selected package batch
    needs: pack
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download NuGet packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nuget-packages
          path: packages
      - name: Install the pinned .NET SDK
        uses: ./.github/actions/setup-dotnet
      - name: Install the CLI from the downloaded package batch
        uses: ./.github/actions/setup-puck
        with:
          directory: packages
      - name: Validate the release source and any existing version tag
        run: puck nuget gate
      - env:
          PACKAGES: ${{ inputs.packages }}
        name: Select and validate the release batch
        run: puck nuget prepare packages release "$PACKAGES"
      - name: Upload the prepared NuGet batch
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: nuget-release
          path: release/
    timeout-minutes: 10
  publish:
    environment:
      name: NuGet
      url: https://www.nuget.org/profiles/ByteTerrace
    if: inputs.publish
    name: Publish the verified package batch
    needs: [prepare, build, verify, docs]
    permissions:
      contents: write
      id-token: write
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install the pinned .NET SDK
        uses: ./.github/actions/setup-dotnet
      - name: Download the prepared NuGet batch
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nuget-release
          path: release
      - name: Install Puck CLI
        uses: ./.github/actions/setup-puck
        with:
          artifact: nuget-packages
      - name: Verify the prepared artifacts
        run: puck nuget verify release
      - env:
          GH_TOKEN: ${{ github.token }}
        name: Pin the package version to this validated commit
        run: puck nuget tag
      - id: nuget-login
        name: NuGet login (Trusted Publishing)
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ByteTerrace
      - env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        name: Push the selected packages and symbols in dependency order
        run: puck nuget push release
      - env:
          GH_TOKEN: ${{ github.token }}
        name: Record this batch on the GitHub Release
        run: puck nuget release release/release.json
      - name: Verify published CLI availability and prepare its CI pin
        run: puck nuget pin-published release puck-cli-pin.patch
      - name: Upload the CLI pin update
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: ignore
          name: puck-cli-pin
          path: puck-cli-pin.patch
    timeout-minutes: 20
