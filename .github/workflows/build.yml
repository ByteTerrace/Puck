name: Test compiled solution
run-name: Solution tests — ${{ github.ref_name }}

on:
  workflow_call:
    inputs:
      prebuilt:
        default: false
        type: boolean
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: true
  DOTNET_NOLOGO: true

jobs:
  artifacts:
    if: ${{ !inputs.prebuilt }}
    name: Build .NET artifacts
    uses: ./.github/workflows/artifacts.yml
  # The manifest's assemblies split into one shard per matrix entry, balanced by the recorded durations in
  # TestDurations.json; the shards together run every assembly exactly once, and each runs whatever another did.
  build:
    if: ${{ !cancelled() && (needs.artifacts.result == 'success' || (inputs.prebuilt && needs.artifacts.result == 'skipped')) }}
    name: Run .NET tests (Windows, shard ${{ matrix.shard }})
    needs: artifacts
    runs-on: windows-2025
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned .NET SDK
        uses: ./.github/actions/setup-dotnet
      # Shader laws compile and reflect through the same pinned compiler the build used.
      - name: Install pinned DXC
        uses: ./.github/actions/setup-dxc
      - name: Download compiled Windows assemblies
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: compiled-windows
          path: artifacts
      - name: Install Puck CLI
        uses: ./.github/actions/setup-puck
        with:
          artifact: nuget-packages
      - name: Restore this commit's compiled outputs
        run: puck artifacts restore
      - env:
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ strategy.job-total }}
        name: Test this shard of the producer's assembly manifest
        run: puck artifacts test-windows --shard "$SHARD" --shards "$SHARDS"
        shell: bash
      - if: always()
        name: Upload test diagnostics
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: warn
          name: test-diagnostics-${{ matrix.shard }}
          path: artifacts/test-results
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    timeout-minutes: 60
