name: Diagnose Azure storage access
on:
  push:
    branches: [codex/azure-ci]
permissions:
  contents: read
  id-token: write
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: Puck
    steps:
      - name: Sign in with the deployment identity
        uses: Azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Reproduce the world snapshot listing without changing storage
        run: |
          az version
          az storage blob list --account-name bytrcstp001 --container-name 5bee6ebb-db15-4fde-b283-3426d06c2d2c --auth-mode login --num-results '*' --query 'length(@)' -o json