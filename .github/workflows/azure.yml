name: Azure

on:
  push:
    branches: [main, codex/azure-ci]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the validated application artifacts
        type: boolean
        default: false
      artifact_run_id:
        description: Optional earlier Azure run with successful application and container builds; reuse its artifacts
        type: string
        default: ''
      channel:
        description: Official content channel
        type: choice
        options: [staging, stable]
        default: staging

permissions:
  contents: read

env:
  CI: true
  DOTNET_NOLOGO: true

jobs:
  identity:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    environment: Blobs
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Validate deployment selection
        if: inputs.deploy && inputs.channel != 'staging'
        run: |
          echo 'Only staging deployment is implemented; choose channel staging.' >&2
          exit 1
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Verify the federated principal and deployment resources
        run: |
          az account show --query '{subscription:id,tenant:tenantId,identity:user.name}'
          az group show --name byteterrace --query '{name:name,location:location}'
          az acr show --name bytrccrp000 --query '{registry:loginServer,mode:roleAssignmentMode,publicNetworkAccess:publicNetworkAccess}'
          az account get-access-token --resource https://containerregistry.azure.net --query expiresOn --output tsv

  infrastructure:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned Bicep
        run: az bicep install --version v0.46.1
      - name: Compile infrastructure from checked-in modules
        run: |
          mkdir -p artifacts
          az bicep build --file src/Puck.Azure.Resources/main.bicep --outfile artifacts/infrastructure.json
          az bicep build-params --file src/Puck.Azure.Resources/main.bicepparam --outfile artifacts/parameters.json
          az bicep build --file src/Puck.Azure.Resources/staging.bicep --outfile artifacts/staging.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: azure-infrastructure
          path: |
            artifacts/infrastructure.json
            artifacts/parameters.json
            artifacts/staging.json
          if-no-files-found: error

  deploy-staging:
    if: >-
      always() && !cancelled() && github.event_name == 'workflow_dispatch' && inputs.deploy && inputs.channel == 'staging' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/azure-ci') &&
      needs.identity.result == 'success' && needs.infrastructure.result == 'success' &&
      (inputs.artifact_run_id != '' || (needs.applications.result == 'success' && needs.containers.result == 'success'))
    needs: [identity, infrastructure, applications, containers]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: Blobs
    concurrency:
      group: azure-staging-deployment
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate the artifact source
        id: source
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.artifact_run_id || github.run_id }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          if ($env:SOURCE_RUN -notmatch '^[0-9]+$') { throw 'Expected a numeric workflow run ID.' }
          $run = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:SOURCE_RUN" | ConvertFrom-Json
          if ($run.path -ne '.github/workflows/azure.yml' -or $run.head_branch -notin @('main','codex/azure-ci')) { throw 'Unexpected artifact source workflow or branch.' }
          $jobs = (gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:SOURCE_RUN/jobs?per_page=100" | ConvertFrom-Json).jobs
          foreach ($name in @('applications','containers (Puck.Actors, web-actors)','containers (Puck.World.Silo, world-silo)')) {
            $job = @($jobs | Where-Object name -eq $name)
            if ($job.Count -ne 1 -or $job[0].conclusion -ne 'success') { throw "Source build did not pass: $name" }
          }
          "commit=$($run.head_sha)" >> $env:GITHUB_OUTPUT
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.artifact_run_id || github.run_id }}
          pattern: azure-*
          path: artifacts/download
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Install pinned Bicep
        run: az bicep install --version v0.46.1
      - name: Publish images and deploy staging infrastructure
        id: stage
        shell: pwsh
        env:
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
          SOURCE_RUN: ${{ inputs.artifact_run_id || github.run_id }}
        run: ./build/Deploy-Staging.ps1 -ArtifactsDirectory artifacts/download -Commit $env:SOURCE_COMMIT -ArtifactRunId $env:SOURCE_RUN
      - name: Deploy the prebuilt Functions payload
        uses: Azure/functions-action@c5060b3b8bb1ebbcb531abd00c822ecbaa8ea656 # v1
        with:
          app-name: ${{ steps.stage.outputs.function-app-name }}
          package: artifacts/azure/functions
          remote-build: false
      - name: Verify deployed applications and authentication
        shell: pwsh
        env:
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
        run: ./build/Test-AzureStaging.ps1 -Commit $env:SOURCE_COMMIT
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: azure-deployment
          path: |
            artifacts/staging-plan.json
            artifacts/staging-outputs.json
            artifacts/release-source.json
            artifacts/*.digest
          if-no-files-found: warn

  applications:
    if: inputs.artifact_run_id == ''
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install WebAssembly tools
        run: dotnet workload install wasm-tools
      - name: Install pinned DXC
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'dxc.zip'
          $destination = Join-Path $env:RUNNER_TEMP 'dxc'
          Invoke-WebRequest 'https://github.com/microsoft/DirectXShaderCompiler/releases/download/v1.9.2607/dxc_2026_07_29.zip' -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne 'a1dfb116ba3eeae6a1582291b53a8e7bf65ad760676bd3194685c8f7367cd241') { throw 'DXC checksum mismatch.' }
          Expand-Archive $archive $destination
          Join-Path $destination 'bin/x64' >> $env:GITHUB_PATH
      - name: Build and verify deployment bundle
        shell: pwsh
        env:
          RELEASE_CHANNEL: ${{ inputs.channel || 'staging' }}
        run: ./build/Build-Azure.ps1 -Channel $env:RELEASE_CHANNEL
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: azure-applications
          path: artifacts/azure
          if-no-files-found: error
          include-hidden-files: true

  containers:
    if: inputs.artifact_run_id == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: Puck.Actors
            image: web-actors
          - project: Puck.World.Silo
            image: world-silo
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build Linux container from the repository root
        env:
          PROJECT: ${{ matrix.project }}
          IMAGE: ${{ matrix.image }}
        run: docker build --file "src/$PROJECT/Dockerfile" --tag "puck/$IMAGE:$GITHUB_SHA" .
      - name: Smoke-test actor startup
        if: matrix.image == 'web-actors'
        run: |
          docker run -d --name actors -p 8080:8080 "puck/web-actors:$GITHUB_SHA"
          trap 'docker logs actors; docker rm -f actors' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:8080/healthz; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Save the tested image
        env:
          IMAGE: ${{ matrix.image }}
        run: docker save "puck/$IMAGE:$GITHUB_SHA" | gzip > image.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: azure-${{ matrix.image }}
          path: image.tar.gz
          compression-level: 0
          if-no-files-found: error
