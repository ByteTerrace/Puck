name: Release the Actors onboarding correction
on:
  push:
    branches: [codex/azure-ci]
permissions:
  contents: read
  id-token: write
concurrency:
  group: azure-production-deployment
  cancel-in-progress: false
env:
  CI: true
  DOTNET_NOLOGO: true
  RELEASE_COMMIT: 574b4bf96dfe15ddbc2ade5d4be6bb99bd3c8f19
jobs:
  deploy:
    name: Build, verify and deploy the Actors correction
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: Puck
    steps:
      - name: Check out the corrected source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 574b4bf96dfe15ddbc2ade5d4be6bb99bd3c8f19
      - name: Install the pinned .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json
      - name: Sign in with fresh OIDC for image publication
        uses: Azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Build and publish the Actors image once
        run: dotnet run -c Release --file build/Azure.cs -- build-actors --no-restart
      - name: Verify the built Actors image
        run: |
          docker run -d --name actors -p 8080:8080 "puck/web-actors:$RELEASE_COMMIT"
          trap 'docker logs actors; docker rm -f actors' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:8080/healthz; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Sign in with fresh OIDC for deployment
        uses: Azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy the verified immutable Actors image
        run: |
          mkdir -p artifacts
          registry=$(az acr show -n bytrccrp000 --query loginServer -o tsv)
          digest=$(az acr repository show -n bytrccrp000 --image "web-actors:$RELEASE_COMMIT" --query digest -o tsv)
          test -n "$digest"
          printf '%s\n' "$registry/web-actors@$digest" > artifacts/web-actors.digest
          az containerapp update -g byteterrace -n bytrccap001 --image "$(cat artifacts/web-actors.digest)" --revision-suffix "git-${RELEASE_COMMIT:0:12}" -o none
          az containerapp show -g byteterrace -n bytrccap001 -o json > artifacts/actors-release.json
          jq -e --arg image "$(cat artifacts/web-actors.digest)" '.properties | .provisioningState == "Succeeded" and .latestReadyRevisionName == .latestRevisionName and .template.containers[0].image == $image' artifacts/actors-release.json
          curl --fail --retry 5 --retry-delay 3 --silent https://bytrccap001.purplerock-ff1b5f1a.southcentralus.azurecontainerapps.io/healthz
          curl --fail --retry 5 --retry-delay 3 --silent https://byteterrace.com/api/health-check | jq -e '.status == "Healthy"'
      - name: Upload the Actors deployment record
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: actors-onboarding-correction
          path: |
            artifacts/web-actors.digest
            artifacts/actors-release.json
          if-no-files-found: ignore
