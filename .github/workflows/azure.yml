name: Release Azure
run-name: Azure ${{ (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && !inputs.deploy)) && 'validation' || 'release' }} — ${{ github.ref_name }}

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      deploy:
        default: true
        type: boolean
  workflow_dispatch:
    inputs:
      deploy:
        default: true
        description: Deploy the verified artifacts and infrastructure to Azure (false validates only)
        type: boolean
      full-reconcile:
        default: false
        description: Plan and apply the platform even when its inputs are unchanged, repairing a change made in Azure by hand
        type: boolean

permissions:
  contents: read

concurrency:
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
  group: ${{ github.event_name == 'pull_request' && format('azure-pr-{0}', github.event.pull_request.number) || format('azure-run-{0}', github.run_id) }}

env:
  CI: true
  DOTNET_NOLOGO: true
  # The deployment's release channel tree: the player channel's releases and the mesh cache sets they ship.
  PLAYER_CHANNEL_URL: https://puck.byteterrace.com/official/releases

jobs:
  artifacts:
    name: Build .NET artifacts
    uses: ./.github/workflows/artifacts.yml
  # The deploy path is what it ships: the artifact build (whose published-World startup check is part of it), the
  # infrastructure compile, the application bundle (browser payload, API documentation), the verified actors container
  # image and the verified host release (the silo's activation, QUIC, checkpoint recovery and the release rehearsal run
  # over its install in `host-release`). Everything else reports on
  # every push in parallel and holds no release while the refactoring campaign suspends test requirements (AGENTS.md):
  # the test shards (`build`), line coverage (`coverage`), the runtime verification (`verify`: documentation corpus,
  # generated contracts, emulator batteries, Linux world tests, SPIR-V comparison), package installation (`pack`)
  # and the browser harness (`browser-verify`). None of them is in deploy's `needs`.
  browser:
    name: Build the WebAssembly payload
    uses: ./.github/workflows/browser.yml
    with:
      stage: publish
  browser-verify:
    name: Verify the WebAssembly payload
    needs: browser
    uses: ./.github/workflows/browser.yml
    with:
      stage: verify
  docs:
    name: Build API documentation
    uses: ./.github/workflows/docs.yml
  build:
    name: Test .NET artifacts
    needs: artifacts
    uses: ./.github/workflows/build.yml
    with:
      prebuilt: true
  # Outside deploy's needs: it reports on every push to main and holds no deploy while the suite climbs to 100%.
  # Its `if` runs it whatever a shard's result, so a red shard still reports coverage.
  # Every shard writes a Cobertura report per assembly; the union must cover every live line outside the hardware-only
  # list (build/CoverageHardwareOnly.txt), and every live project must be loaded by some run. The Puck.*.Post emulator
  # batteries are harnesses and sit outside both rules; the emulator test suites run them to cover the cores.
  coverage:
    if: ${{ !cancelled() && needs.build.result != 'skipped' }}
    name: Check line coverage
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned .NET SDK
        uses: ./.github/actions/setup-dotnet
      - name: Download every shard's test results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          merge-multiple: true
          path: artifacts/test-results
          pattern: test-diagnostics-*
      - name: Install Puck CLI
        uses: ./.github/actions/setup-puck
        with:
          artifact: nuget-packages
      - name: Merge the shards' coverage and require every live line
        run: puck artifacts coverage --results artifacts/test-results
        shell: bash
    timeout-minutes: 15
  verify:
    name: Verify runtime artifacts
    needs: artifacts
    uses: ./.github/workflows/verify.yml
    with:
      prebuilt: true
  pack:
    name: Verify package installation
    needs: artifacts
    uses: ./.github/workflows/pack.yml
    with:
      prebuilt: true
  bicep:
    # Infrastructure validation runs only on main (it needs the environment's Azure sign-in to restore Template Specs),
    # so a validation run on the integration branch checks offline what it can: an unformatted Bicep source fails here
    # instead of stopping the next main deploy. Diagnostics need the restore, so they stay with that job.
    name: Check Bicep sources
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Bicep
        run: az bicep install --version v0.48.1
      - name: Every Bicep source is formatted
        run: |
          set -euo pipefail
          status=0
          for file in $(git ls-files 'src/Puck.Azure.Resources/*.bicep' 'src/Puck.Azure.Resources/**/*.bicep'); do
            # Formatting a source that imports types from a Template Spec restores it from Azure, which needs the sign-in
            # only main's infrastructure job has; that job checks those sources.
            if grep -qE "from 'ts[:/]" "$file"; then continue; fi
            # --stdout appends a newline of its own (Bicep 0.48), so format to a file and compare that.
            az bicep format --file "$file" --outfile "${RUNNER_TEMP}/formatted.bicep"
            if ! diff -q "$file" "${RUNNER_TEMP}/formatted.bicep" >/dev/null; then
              echo "::error file=$file::not formatted; run az bicep format --file $file"; status=1
            fi
          done
          exit $status
  infrastructure:
    env:
      BICEPPARAM_WORLD_MCP: ${{ vars.WORLD_MCP || 'null' }}
    environment: Puck
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    name: Validate Azure infrastructure
    needs: artifacts
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned .NET SDK
        uses: ./.github/actions/setup-dotnet
      - name: Install Puck CLI
        uses: ./.github/actions/setup-puck
        with:
          artifact: nuget-packages
          azure: "true"
      - name: Sign in to Azure with OIDC
        uses: ./.github/actions/azure-login
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
      - name: Install pinned Bicep
        run: az bicep install --version v0.48.1
      - name: Restore pinned bvm Template Specs and compile infrastructure
        run: puck azure build-infrastructure
      - name: Upload compiled Azure infrastructure
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          if-no-files-found: error
          name: azure-infrastructure
          path: artifacts/infrastructure
    timeout-minutes: 15
  deploy:
    concurrency:
      cancel-in-progress: false
      group: azure-production-deployment
    env:
      BICEPPARAM_WORLD_MCP: ${{ vars.WORLD_MCP || 'null' }}
    environment:
      name: Puck
      url: https://puck.byteterrace.com
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy && github.ref == 'refs/heads/main')
    name: Deploy and verify Azure production
    # Only what the release ships sits in needs (see the comment above `browser`): the verification workflows, the test
    # shards, coverage and the browser harness report on every push and neither hold nor skip it, while the owner's
    # refactoring campaign suspends test requirements (AGENTS.md). The browser payload arrives through `applications`.
    needs: [applications, artifacts, containers, host-release, infrastructure]
    # The player channel publishes only after a deploy of this commit, whose outputs it reads.
    outputs:
      deployed: ${{ steps.current.outputs.deploy }}
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned .NET SDK
        uses: ./.github/actions/setup-dotnet
      - name: Install Puck CLI
        uses: ./.github/actions/setup-puck
        with:
          artifact: nuget-packages
          azure: "true"
      - id: current
        name: Skip a superseded commit
        run: puck azure current
      - if: steps.current.outputs.deploy == 'true'
        name: Download deployment inputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts/source
          pattern: azure-*
      - if: steps.current.outputs.deploy == 'true'
        name: Verify this run's deployment bundle
        run: puck bundle verify artifacts/source/azure-applications "$GITHUB_SHA"
        shell: bash
      - if: steps.current.outputs.deploy == 'true'
        name: Check the runner's AzCopy
        run: azcopy --version
      - if: steps.current.outputs.deploy == 'true'
        name: Sign in to Azure with OIDC
        uses: ./.github/actions/azure-login
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
      - if: steps.current.outputs.deploy == 'true'
        name: Install pinned Bicep
        run: az bicep install --version v0.48.1
      - if: steps.current.outputs.deploy == 'true'
        name: Reconcile the production platform
        env:
          FULL_RECONCILE: ${{ inputs.full-reconcile && 'true' || 'false' }}
        run: puck azure deploy-infrastructure --infrastructure-artifacts artifacts/source/azure-infrastructure $([ "$FULL_RECONCILE" = true ] && echo --full)
        shell: bash
      - if: steps.current.outputs.deploy == 'true'
        name: Install QUIC for production verification
        uses: ./.github/actions/setup-quic
      # GitHub's OIDC assertion expires independently of cached Azure access tokens.
      # Refresh before each deployment phase can request a different resource token.
      - if: steps.current.outputs.deploy == 'true'
        name: Refresh OIDC for application publication
        uses: ./.github/actions/azure-login
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
      - id: release
        if: steps.current.outputs.deploy == 'true'
        name: Publish containers and apply application configuration
        run: puck azure deploy-applications --artifacts-directory artifacts/source --commit "$GITHUB_SHA"
        shell: bash
      - if: steps.current.outputs.deploy == 'true'
        name: Refresh OIDC for World deployment
        uses: ./.github/actions/azure-login
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
      - id: vault
        if: steps.current.outputs.deploy == 'true'
        name: Admit the runner to the signing-key vault
        run: puck azure vault-access
        shell: bash
      # The host release is pushed before the world deploys: its machines install it from the channel, through the same
      # installer and update chain a player's machine uses. The push signs the tree in place, which the preparation reads.
      - if: steps.current.outputs.deploy == 'true'
        env:
          AZCOPY_CONCURRENCY_VALUE: AUTO
          AZCOPY_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
        name: Sign the host release and push the server channel
        run: puck channel push --tree artifacts/source/azure-server-channel --channel server --sequence ${{ github.run_number }} --host azure
        shell: bash
      - if: steps.current.outputs.deploy == 'true'
        name: Prepare the complete managed world release
        run: puck azure prepare-world-release
        shell: bash
      - if: steps.current.outputs.deploy == 'true'
        name: Deploy the primary Puck world
        run: puck world release deploy artifacts/world-release --host azure
        shell: bash
      - if: always() && steps.vault.outcome != 'skipped'
        name: Restore signing-key vault restrictions
        run: puck azure vault-access --restore
        shell: bash
      - if: steps.current.outputs.deploy == 'true'
        name: Refresh OIDC for Functions deployment
        uses: ./.github/actions/azure-login
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
      - id: scm
        if: steps.current.outputs.deploy == 'true'
        name: Admit the runner to the Functions deployment endpoint
        run: puck azure functions-access
        shell: bash
      - if: steps.current.outputs.deploy == 'true'
        name: Deploy the prebuilt Functions payload
        uses: Azure/functions-action@c5060b3b8bb1ebbcb531abd00c822ecbaa8ea656 # v1.5.7
        with:
          app-name: ${{ steps.release.outputs.function-app-name }}
          package: artifacts/azure/functions
          remote-build: false
          sku: flexconsumption
      - if: always() && steps.scm.outcome != 'skipped'
        name: Restore Functions deployment endpoint restrictions
        run: puck azure functions-access --restore
        shell: bash
      - if: steps.current.outputs.deploy == 'true'
        name: Require ready services before publishing the website
        run: puck azure test-production --before-static-publication --commit "$GITHUB_SHA"
        shell: bash
      - if: steps.current.outputs.deploy == 'true'
        name: Refresh OIDC for website publication
        uses: ./.github/actions/azure-login
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
      - env:
          AZCOPY_CONCURRENCY_VALUE: AUTO
          AZCOPY_JOB_PLAN_LOCATION: ${{ github.workspace }}/artifacts/azcopy
          AZCOPY_LOG_LOCATION: ${{ github.workspace }}/artifacts/azcopy
          AZCOPY_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
        if: steps.current.outputs.deploy == 'true'
        name: Publish the website and stable official content
        run: puck azure publish-static
        shell: bash
      - if: steps.current.outputs.deploy == 'true'
        name: Verify production through Front Door
        run: puck azure test-production --commit "$GITHUB_SHA"
        shell: bash
      - if: always() && steps.current.outputs.deploy == 'true'
        name: Upload production verification records
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          if-no-files-found: error
          name: azure-production-release
          path: |
            artifacts/production-*.json
            artifacts/release-source.json
            artifacts/world-authentication.json
            artifacts/world-silo.public-key
            artifacts/world-host.engine
            artifacts/*.digest
            artifacts/previous-actor-release.json
            artifacts/functions-scm-*.json
            artifacts/azcopy/*.log
    timeout-minutes: 120
  # The player channel: the consumer build (what the RTX 2060 test machine installs) as a signed release in the
  # deployment's own hosting. A hosted runner has no GPU, so the build is assembled without baking boots and takes its
  # baked mesh store from the cache set a GPU machine wrote into the channel's own store for the same mesh bake identity
  # (`puck world caches produce --host azure`); the set's meshes are objects the release then shares, so the push copies
  # none of them again. A player can bake, so a backend with no set for this identity, or a set missing groups the world
  # needs, warns and the channel still ships. The build carries the deployment's sign-in (the deploy's
  # world-authentication.json) and the provider extension it names, so a player joins with the files the channel
  # installed. It runs after deploy and nothing waits on it.
  player:
    concurrency:
      cancel-in-progress: false
      group: azure-player-channel
    environment: Puck
    # The deploy job leaves the deployment's outputs only when it deployed this commit (a superseded commit skips it).
    if: needs.deploy.outputs.deployed == 'true'
    name: Publish the player channel
    needs: [artifacts, deploy]
    permissions:
      contents: read
      id-token: write
    runs-on: windows-2025
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned .NET SDK
        uses: ./.github/actions/setup-dotnet
      - name: Install pinned DXC
        uses: ./.github/actions/setup-dxc
      - name: Restore the shader compiler cache
        uses: ./.github/actions/shader-cache
        with:
          mode: restore
      - name: Install Puck CLI
        uses: ./.github/actions/setup-puck
        with:
          artifact: nuget-packages
          azure: "true"
      - name: Download the deployment's outputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: azure-production-release
          path: artifacts
      - name: Assemble the player build without baking boots
        run: >-
          puck world player worlds/debug --output artifacts/player --no-bake --channel-url "$PLAYER_CHANNEL_URL" --channel-name player
          --extension src/Puck.World.Azure --sign-in artifacts/world-authentication.json
        shell: bash
      # Anonymous reads through the deployment's public edge, as an install reads the channel: no identity needed.
      # A player can bake (the owner's ruling), so a set is a warm start, never a precondition: a build whose set is
      # missing still ships, and the player's machine derives what the channel did not carry.
      - name: Take the mesh cache sets whose bake identity matches this build, when there are any
        run: |
          set -uo pipefail
          if ! puck world caches fetch artifacts/player --store "$PLAYER_CHANNEL_URL" --notes artifacts/player-notes.txt --wait 15; then
            echo "::warning::No complete mesh cache set matches this build; the channel ships without it and players bake what they need."
            [ -f artifacts/player-notes.txt ] || : > artifacts/player-notes.txt
          fi
        shell: bash
      - name: Write the player release tree
        run: >-
          puck publish --app puck.world --channel player --rid win-x64 --input artifacts/player --output artifacts/player-channel
          --version "0.1.${{ github.run_number }}" --notes "$(cat artifacts/player-notes.txt)"
          --exclude player-logs cache/meshes-intermediates player-caches --bootstrap launcher
        shell: bash
      - name: Sign in to Azure with OIDC
        uses: ./.github/actions/azure-login
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
      - id: vault
        name: Admit the runner to the signing-key vault
        run: puck azure vault-access
        shell: bash
      - env:
          AZCOPY_CONCURRENCY_VALUE: AUTO
          AZCOPY_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
        name: Sign the release and push the player channel
        run: puck channel push --tree artifacts/player-channel --channel player --sequence ${{ github.run_number }} --host azure
        shell: bash
      - if: always() && steps.vault.outcome != 'skipped'
        name: Restore signing-key vault restrictions
        run: puck azure vault-access --restore
        shell: bash
    timeout-minutes: 135
  # Reports, early and on every run, whether the GPU machine has produced this build's mesh cache sets, so the lead
  # produces them before pushing main rather than learning from a held channel after the deploy. Holds nothing.
  player-caches:
    continue-on-error: true
    name: Check the player channel's mesh cache sets
    needs: artifacts
    permissions:
      contents: read
    runs-on: windows-2025
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned .NET SDK
        uses: ./.github/actions/setup-dotnet
      - name: Install Puck CLI
        uses: ./.github/actions/setup-puck
        with:
          artifact: nuget-packages
      # The World build this commit's artifacts hold: the same bake code and kernels a player build of it carries.
      - name: Download the World build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: world-windows-framework-dependent
          path: artifacts/world
      - name: Look for a whole cache set for this build's bake identity and world
        run: puck world caches status worlds/debug --build artifacts/world --store "$PLAYER_CHANNEL_URL"
        shell: bash
    timeout-minutes: 15
  applications:
    name: Assemble the application bundle
    needs: [artifacts, browser, docs]
    runs-on: windows-2025
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No NuGet cache: this job restores no project; it runs the installed CLI and the dashboard's npm build.
      - name: Install the pinned .NET SDK
        uses: ./.github/actions/setup-dotnet
      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          cache: npm
          cache-dependency-path: src/Puck.Dashboard/src/package-lock.json
          node-version: 26.12.1
      - name: Install Puck CLI
        uses: ./.github/actions/setup-puck
        with:
          artifact: nuget-packages
          azure: "true"
      - name: Download the Functions payload and its source identity
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: runtime-payloads
          path: artifacts/runtime
      - name: Download the WebAssembly payload
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: browser-payload
          path: artifacts/runtime/browser
      # As its zip, unextracted: the action's streaming extraction of the site's 12,600 files fails on this runner every
      # time, after five retries. `puck docs build --site` extracts the archive itself.
      - name: Download the API documentation site as its archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: documentation
          path: artifacts/documentation
          skip-decompress: true
      # The dashboard's staging Brotli-compresses about 100 MB at the highest quality, most of it the DuckDB modules and
      # extensions; its cache holds their outputs, so only a dependency change compresses them again.
      - id: brotli-cache
        name: Restore the dashboard Brotli cache
        uses: ./.github/actions/brotli-cache
        with:
          mode: restore
      - name: Build and verify deployment bundle
        run: puck azure build --runtime-artifacts artifacts/runtime --documentation artifacts/documentation
        shell: bash
      - if: steps.brotli-cache.outputs.cache-hit != 'true'
        name: Save the dashboard Brotli cache
        uses: ./.github/actions/brotli-cache
        with:
          key: ${{ steps.brotli-cache.outputs.key }}
          mode: save
      - name: Upload the application deployment bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          if-no-files-found: error
          include-hidden-files: true
          name: azure-applications
          path: artifacts/azure
    timeout-minutes: 60
  container-images:
    name: Build container (${{ matrix.image }})
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The Linux cache verify.yml's shader-bytecode job saves after a passing comparison. This job only reads it: the
      # image's DXC is the same pinned archive, so a restored entry is a hit inside the container too.
      - if: matrix.shader-cache
        name: Restore the Linux shader compiler cache
        uses: ./.github/actions/shader-cache
        with:
          mode: restore
      - env:
          IMAGE: ${{ matrix.image }}
          PROJECT: ${{ matrix.project }}
          SHADER_CACHE: ${{ matrix.shader-cache && '.tmp/shader-cache' || '' }}
        name: Build Linux container from the repository root
        run: docker build ${SHADER_CACHE:+--build-context "shader-cache=$SHADER_CACHE"} --file "src/$PROJECT/Dockerfile" --tag "puck/$IMAGE:$GITHUB_SHA" .
      - env:
          IMAGE: ${{ matrix.image }}
        name: Save the built image
        run: docker save "puck/$IMAGE:$GITHUB_SHA" | gzip > image.tar.gz
      - name: Upload the ${{ matrix.image }} image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          compression-level: 0
          if-no-files-found: error
          name: azure-${{ matrix.image }}
          path: image.tar.gz
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: web-actors
            project: Puck.Actors
            shader-cache: false
    timeout-minutes: 45
  containers:
    name: Verify container (${{ matrix.image }})
    needs: [artifacts, container-images]
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download the ${{ matrix.image }} image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: azure-${{ matrix.image }}
      - name: Load this run's image
        run: docker load --input image.tar.gz
      - if: matrix.image == 'web-actors'
        name: Smoke-test actor startup
        run: |
          docker run -d --name actors -p 8080:8080 "puck/web-actors:$GITHUB_SHA"
          trap 'docker logs actors; docker rm -f actors' EXIT
          curl --fail --silent --show-error --retry 60 --retry-all-errors \
            --retry-delay 2 --retry-max-time 120 --max-time 5 http://localhost:8080/healthz
    strategy:
      fail-fast: false
      matrix:
        image: [web-actors]
    timeout-minutes: 20
  # The host release: what a hosting machine installs from the server channel, built on the runtime it runs on. The
  # unsigned tree is the deploy's input (it signs and pushes it); this job also signs a copy with a throwaway root, installs
  # it exactly as a machine does (the installer it carries, its signed manifest by pin), and runs the installed release:
  # two boots against a fixture store (activation, checkpoint recovery, health, QUIC and the MCP entry point) and the
  # worker's managed start rehearsed through the coordinator (a release section, the bootstrap's roots and group record,
  # release control, admission and drain), which runs nowhere else before a deployment's fresh compute boots it.
  host-release:
    name: Build and verify the host release
    needs: artifacts
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned .NET SDK
        uses: ./.github/actions/setup-dotnet
      - name: Install pinned DXC
        uses: ./.github/actions/setup-dxc
      - name: Install pinned LLVM and Rust
        uses: ./.github/actions/setup-toolchains
      - name: Restore the Linux shader compiler cache
        uses: ./.github/actions/shader-cache
        with:
          mode: restore
      - name: Install QUIC for silo verification
        uses: ./.github/actions/setup-quic
      - name: Install Puck CLI
        uses: ./.github/actions/setup-puck
        with:
          artifact: nuget-packages
          azure: "true"
      - name: Build the host release
        run: >-
          puck world host build worlds/debug --output artifacts/host --tls-front
          --extension src/Puck.World.Azure --extension src/Puck.HumbleGamingBrick.Forge --extension src/Puck.AdvancedGamingBrick.Forge
          --extension src/Puck.HumbleGamingDeck.Forge --extension src/Puck.Mcp --extension src/Puck.Mcp.Azure
        shell: bash
      - name: Write the server channel's release tree
        run: puck publish --app puck.world.host --channel server --rid linux-x64 --input artifacts/host --output artifacts/server-channel --version "0.1.${{ github.run_number }}"
        shell: bash
      - name: Upload the unsigned server channel tree
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          if-no-files-found: error
          name: azure-server-channel
          path: artifacts/server-channel
      - name: Sign a verification copy and install it as a hosting machine does
        run: |
          set -euo pipefail
          cp -r artifacts/server-channel artifacts/server-verify
          puck channel push --tree artifacts/server-verify --channel server --sequence 1 --to artifacts/server-mirror --signing-key artifacts/verification-root.pk8
          puck world host fetch artifacts/server-verify --source artifacts/server-mirror --to artifacts/server-install
        shell: bash
      - name: Verify primary Puck activation, QUIC, checkpoint recovery, and the MCP entry point
        run: puck azure test-world-host --install artifacts/server-install
        shell: bash
      - name: Rehearse a first deployment of the release's worlds through its install
        run: puck world release rehearse --install artifacts/server-install --output artifacts/world-release-rehearsal
        shell: bash
    timeout-minutes: 60
