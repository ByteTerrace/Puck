name: Verify runtime behavior
run-name: Runtime verification — ${{ github.ref_name }}

# The emulator matrix. HGB runs on every change: the Humble GamingBrick battery's self-contained stages plus every
# corpus ROM, against the corpora pinned in src/Puck.HumbleGamingBrick.Post/corpora.json; no file records an expected
# outcome, so the step goes red and the job summary names every ROM that does not pass, but the step is informational
# (`continue-on-error`) so deploy is not held while ROMs fail. The self-contained stages gate through
# `Puck.HumbleGamingBrick.Tests`. AGB runs the Advanced GamingBrick battery against its own corpora and fails the job
# on any failing check; its BIOS-dependent stages skip here. Both batteries
# are pure-CPU console applications; neither needs a GPU or a display. `ledgers` runs `puck schema --check`,
# `puck registry --check`, `puck shaders generate --check`, `puck architecture --check` and `puck branding --check`
# from the installed producer CLI artifact on every change, so a document field added without regenerating the
# checked-in schema, the dashboard portal's generated world types (which `puck schema` writes and checks with the
# schema), or the name registry, an SDF instruction-set change without regenerating the kernels' sdf-isa.hlsli, or a
# project declaration changed without regenerating the layering block in docs/project-map.md, fails the build here
# rather than only in a manual verb run. The branding check also catches drift in distributed assets and their source wiring.
# `shader-bytecode` is the binding contract's cross-host gate leg: it compiles every shader with the pinned Linux DXC
# through the build's own CompileShaders target and holds each SPIR-V output byte for byte to the Windows build's,
# which the artifacts job collected (`puck shaders compare --build`). DXIL is no part of it: Direct3D 12 is its one
# reader, so build/Shaders.targets compiles DXIL on Windows alone and this Linux build compiles none. Once a comparison passes, it saves those
# Linux compiles as the Linux shader cache under the key of every shader input and both DXC pins; a later run whose key
# already has that cache skips the comparison and says so, and the silo container build restores the cache.

on:
  workflow_call:
    inputs:
      prebuilt:
        default: false
        type: boolean
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  cancel-in-progress: false
  group: verify-${{ github.run_id }}

env:
  CI: true
  DOTNET_NOLOGO: true

jobs:
  artifacts:
    if: ${{ !inputs.prebuilt }}
    name: Build .NET artifacts
    uses: ./.github/workflows/artifacts.yml
  gaming-bricks:
    if: ${{ !cancelled() && (needs.artifacts.result == 'success' || (inputs.prebuilt && needs.artifacts.result == 'skipped')) }}
    name: Verify ${{ matrix.name }} emulation
    needs: artifacts
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned .NET SDK
        uses: ./.github/actions/setup-dotnet
      - name: Restore corpus cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: corpora-${{ matrix.brick }}-${{ hashFiles(format('src/{0}/corpora.json', matrix.project)) }}
          path: ~/.local/share/Puck/corpora
      - name: Download HGB and AGB binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: emulator-batteries
          path: artifacts/batteries
      - name: Fetch pinned ${{ matrix.name }} corpora
        run: dotnet artifacts/batteries/${{ matrix.brick }}/${{ matrix.project }}.dll --fetch-corpora
      - continue-on-error: ${{ matrix.informational }}
        name: Run the ${{ matrix.name }} battery
        run: dotnet artifacts/batteries/${{ matrix.brick }}/${{ matrix.project }}.dll ${{ matrix.arguments }} --artifacts artifacts/${{ matrix.brick }}-post
      - if: always()
        name: Summarize ${{ matrix.name }} results
        run: |
          {
            echo '```'
            cat artifacts/${{ matrix.brick }}-post/post-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        name: Upload ${{ matrix.name }} results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: ${{ matrix.artifact }}
          path: artifacts/${{ matrix.brick }}-post
    strategy:
      fail-fast: false
      matrix:
        include:
          - arguments: --require-assets
            artifact: hgb-post
            brick: hgb
            informational: true
            name: HGB
            project: Puck.HumbleGamingBrick.Post
            timeout: 30
          - arguments: ""
            artifact: agb-post
            brick: agb
            informational: false
            name: AGB
            project: Puck.AdvancedGamingBrick.Post
            timeout: 20
    timeout-minutes: ${{ matrix.timeout }}
  # The WebAssembly payload is its own producer, which verifies what it publishes; a release calls it beside this
  # workflow, and a standalone run calls it here.
  browser:
    if: ${{ !inputs.prebuilt }}
    name: Build and verify the WebAssembly payload
    uses: ./.github/workflows/browser.yml
  world:
    if: ${{ !cancelled() && (needs.artifacts.result == 'success' || (inputs.prebuilt && needs.artifacts.result == 'skipped')) }}
    name: Verify world authentication and recovery (Linux)
    needs: artifacts
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned .NET SDK
        uses: ./.github/actions/setup-dotnet
      - name: Download World test assemblies
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: world-verification
          path: artifacts/world-tests
      - name: Install QUIC for world verification
        uses: ./.github/actions/setup-quic
      - name: Install Puck CLI
        uses: ./.github/actions/setup-puck
        with:
          artifact: nuget-packages
      - name: Run the compiled world authentication and recovery tests
        run: puck artifacts test-world
      - if: always()
        name: Upload world verification results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: warn
          name: world-test-results-linux
          path: artifacts/world-test-results
    timeout-minutes: 15
  ledgers:
    if: ${{ !cancelled() && (needs.artifacts.result == 'success' || (inputs.prebuilt && needs.artifacts.result == 'skipped')) }}
    name: Verify generated contracts and branding
    needs: artifacts
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned .NET SDK
        uses: ./.github/actions/setup-dotnet
      - name: Install Puck CLI
        uses: ./.github/actions/setup-puck
        with:
          artifact: nuget-packages
      - name: puck schema --check
        run: puck schema --check
      - name: puck registry --check
        run: puck registry --check
      - name: puck shaders generate --check
        run: puck shaders generate --check
      - name: puck architecture --check
        run: puck architecture --check
      - name: puck branding --check
        run: puck branding --check
    timeout-minutes: 15
  shader-bytecode:
    if: ${{ !cancelled() && (needs.artifacts.result == 'success' || (inputs.prebuilt && needs.artifacts.result == 'skipped')) }}
    name: Compare Linux SPIR-V with the Windows build
    needs: artifacts
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The Linux shader cache is saved under its key only after a comparison of exactly those inputs passed, so a cache
      # under this run's key means there is nothing new to compare.
      - id: compared
        name: Look up a passing comparison of these shader inputs
        uses: ./.github/actions/shader-cache
        with:
          mode: lookup
      - env:
          KEY: ${{ steps.compared.outputs.key }}
        if: steps.compared.outputs.cache-hit == 'true'
        name: Skip the comparison these shader inputs already passed
        run: |
          echo "Skipped: a previous run compared Linux and Windows DXC output for exactly these shader inputs and saved $KEY once it passed." | tee -a "$GITHUB_STEP_SUMMARY"
      - if: steps.compared.outputs.cache-hit != 'true'
        name: Install the pinned .NET SDK
        uses: ./.github/actions/setup-dotnet
      - if: steps.compared.outputs.cache-hit != 'true'
        name: Install pinned DXC
        uses: ./.github/actions/setup-dxc
      - if: steps.compared.outputs.cache-hit != 'true'
        name: Download the Windows build's SPIR-V
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: shader-bytecode-windows
          path: ${{ runner.temp }}/shader-bytecode-windows
      - if: steps.compared.outputs.cache-hit != 'true'
        name: Install Puck CLI
        uses: ./.github/actions/setup-puck
        with:
          artifact: nuget-packages
      # --cache compiles into the absent directory the shader-cache action saves, and keeps it.
      - id: compare
        if: steps.compared.outputs.cache-hit != 'true'
        name: Compile the shaders with Linux DXC and compare every SPIR-V module byte for byte
        run: puck shaders compare --build "$RUNNER_TEMP/shader-bytecode-windows" --cache .tmp/shader-cache
      # A difference is read from both hosts' bytes: spirv-dis disassembles either host's SPIR-V.
      - if: failure() && steps.compare.outcome == 'failure'
        name: Collect the Linux build's SPIR-V a failed comparison read
        run: puck shaders collect "$RUNNER_TEMP/shader-bytecode-linux"
      - if: failure() && steps.compare.outcome == 'failure'
        name: Upload the Linux build's SPIR-V
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: shader-bytecode-linux
          path: ${{ runner.temp }}/shader-bytecode-linux
      - if: steps.compared.outputs.cache-hit != 'true'
        name: Save this comparison's Linux compiles as the Linux shader cache
        uses: ./.github/actions/shader-cache
        with:
          key: ${{ steps.compared.outputs.key }}
          mode: save
    timeout-minutes: 30
