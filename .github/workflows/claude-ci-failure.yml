name: Diagnose CI failures
run-name: Diagnose — ${{ github.event.workflow_run.name }} on ${{ github.event.workflow_run.head_branch }}

# When a watched workflow fails on a branch of this repository, Claude reads the failed jobs' logs and the source at the
# failing commit and reports the cause once, as an issue labelled `ci-failure` (or a comment on the open issue that
# already covers it). It diagnoses only: it edits nothing, pushes nothing and reruns nothing. workflow_run jobs run on
# the default branch, so the `puck-github` federation rule (claude-federation action) admits them whatever branch
# failed. Runs from forks are skipped: their code is never checked out beside an id-token. GitHub tokens open the
# issues, so no Claude GitHub App is needed here.

on:
  workflow_run:
    types: [completed]
    workflows:
      - Check source formatting
      - Release Azure
      - Release NuGet packages

concurrency:
  cancel-in-progress: false
  group: claude-ci-failure-${{ github.event.workflow_run.name }}-${{ github.event.workflow_run.head_branch }}

permissions:
  contents: read

jobs:
  diagnose:
    # The Claude Code GitHub Action refuses bot actors; a bot's failed run (a dependency bump) is skipped instead.
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.head_repository.full_name == github.repository && !endsWith(github.actor, '[bot]')
    name: Diagnose the failed run
    permissions:
      actions: read
      contents: read
      id-token: write
      issues: write
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the failing commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha }}
      - id: federation
        name: Read the Claude federation identifiers
        uses: ./.github/actions/claude-federation
      - env:
          GH_TOKEN: ${{ github.token }}
        name: Diagnose with Claude Code
        uses: anthropics/claude-code-action@db77d4d3c98f3f6380e7cd45ffba2342a3dbde3c # v1.0.254
        with:
          anthropic_federation_rule_id: ${{ steps.federation.outputs.rule }}
          anthropic_organization_id: ${{ steps.federation.outputs.organization }}
          anthropic_service_account_id: ${{ steps.federation.outputs.service-account }}
          claude_args: |
            --model claude-opus-5-5
            --max-turns 60
            --allowedTools "Read,Glob,Grep,Bash(gh run view:*),Bash(gh run list:*),Bash(gh issue list:*),Bash(gh issue view:*),Bash(gh issue create:*),Bash(gh issue comment:*),Bash(gh label create:*),Bash(git log:*),Bash(git show:*)"
          github_token: ${{ github.token }}
          prompt: |
            A CI run of ${{ github.repository }} failed. Diagnose it and report once.

            - Run: ${{ github.event.workflow_run.html_url }} (id ${{ github.event.workflow_run.id }})
            - Workflow: ${{ github.event.workflow_run.name }}, triggered by ${{ github.event.workflow_run.event }}
            - Branch: ${{ github.event.workflow_run.head_branch }}, commit ${{ github.event.workflow_run.head_sha }} (checked out here)

            1. List the run's jobs with `gh run view ${{ github.event.workflow_run.id }}` and read the failed jobs' logs
               with `gh run view ${{ github.event.workflow_run.id }} --log-failed`. Read the source at this commit until
               you can name the cause; AGENTS.md and docs/development/ci.md describe the pipeline.
            2. Run `gh label create ci-failure --color B60205 --description "A CI failure Claude diagnosed" --force`,
               then `gh issue list --label ci-failure --state open`. If an open issue already covers this cause, comment
               on it with this run's link and anything new. Otherwise create one titled
               "CI: <workflow> — <the cause in a few words>" with the `ci-failure` label.
            3. The report states: the failing job and step; the root cause, citing file:line at this commit; the decisive
               log lines as a short excerpt; whether this commit introduced it or it is pre-existing, flaky or
               infrastructure; and the smallest proper fix. Say plainly what you could not confirm.

            Do not edit files, push, rerun or cancel workflows.
    timeout-minutes: 30
