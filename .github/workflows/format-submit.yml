name: Apply formatting
run-name: Apply verified formatting — ${{ github.event.workflow_run.head_branch }}

# The write token never shares a runner with PR code or a PR-controlled build.
# Only this workflow and the submitter from the default branch are executed.
on:
  workflow_run:
    workflows: [Check source formatting]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: format-submit-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  submit:
    name: Apply the verified formatting patch
    if: >-
      github.event.workflow_run.conclusion == 'success' ||
      github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write
      contents: write
      pull-requests: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Install the pinned .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Validate and apply the formatting artifact
        env:
          GH_TOKEN: ${{ github.token }}
          FORMAT_RUN_ID: ${{ github.event.workflow_run.id }}
        run: dotnet run -c Release --file build/FormatSubmit.cs
