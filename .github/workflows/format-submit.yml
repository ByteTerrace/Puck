name: Apply formatting
run-name: Apply verified formatting — ${{ github.event.workflow_run.head_branch }}

# The write token never shares a runner with PR code or a PR-controlled build.
# Only this workflow and the submitter from the default branch are executed.
on:
  workflow_run:
    types: [completed]
    workflows: [Check source formatting]

permissions:
  contents: read

concurrency:
  cancel-in-progress: false
  group: format-submit-${{ github.event.workflow_run.head_branch }}

env:
  CI: true
  DOTNET_NOLOGO: true

jobs:
  submit:
    if: >-
      github.event.workflow_run.conclusion == 'success' ||
      github.event.workflow_run.conclusion == 'failure'
    name: Apply the verified formatting patch
    permissions:
      actions: write
      contents: write
      pull-requests: read
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
      - name: Install the pinned .NET SDK
        uses: ./.github/actions/setup-dotnet
        with:
          cache: "true"
      - name: Install pinned DXC
        uses: ./.github/actions/setup-dxc
      - name: Install Puck CLI from the default branch
        uses: ./.github/actions/setup-puck
      - env:
          FORMAT_RUN_ID: ${{ github.event.workflow_run.id }}
          GH_TOKEN: ${{ github.token }}
        name: Validate and apply the formatting artifact
        run: puck format submit
    timeout-minutes: 40
