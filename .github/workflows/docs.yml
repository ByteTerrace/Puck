name: Build API documentation
run-name: API documentation — ${{ github.ref_name }}

on:
  workflow_call:
    inputs:
      prebuilt:
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: read

jobs:
  artifacts:
    name: Build .NET artifacts
    if: ${{ !inputs.prebuilt }}
    uses: ./.github/workflows/artifacts.yml
  build:
    name: Generate and validate the documentation site
    needs: artifacts
    if: ${{ !cancelled() && (needs.artifacts.result == 'success' || (inputs.prebuilt && needs.artifacts.result == 'skipped')) }}
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            src/*/packages.lock.json
            tests/*/packages.lock.json
            global.json
            .config/dotnet-tools.json
      - name: Install Puck CLI
        uses: ./.github/actions/setup-puck
        with:
          artifact: nuget-packages
      - name: Download the compiled Roslyn analyzers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: compiler-analyzers
          path: src/Puck.Analyzers/bin/Release/netstandard2.0
      - name: Build website documentation
        shell: bash
        run: puck docs build
      - name: Upload API documentation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: documentation
          path: artifacts/docs
          if-no-files-found: error
