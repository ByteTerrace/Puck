name: Build API documentation
run-name: API documentation — ${{ github.ref_name }}

on:
  workflow_call:
    inputs:
      prebuilt:
        default: false
        type: boolean
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: true
  DOTNET_NOLOGO: true

jobs:
  artifacts:
    if: ${{ !inputs.prebuilt }}
    name: Build .NET artifacts
    uses: ./.github/workflows/artifacts.yml
  build:
    if: ${{ !cancelled() && (needs.artifacts.result == 'success' || (inputs.prebuilt && needs.artifacts.result == 'skipped')) }}
    name: Generate and validate the documentation site
    needs: artifacts
    runs-on: windows-2025
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned .NET SDK
        uses: ./.github/actions/setup-dotnet
        with:
          cache: "true"
      - name: Install Puck CLI
        uses: ./.github/actions/setup-puck
        with:
          artifact: nuget-packages
      - name: Download the compiled Roslyn analyzers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: compiler-analyzers
          path: src/Puck.Analyzers/bin/Release/netstandard2.0
      - name: Build website documentation
        run: puck docs build
        shell: bash
      - name: Upload API documentation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: documentation
          path: artifacts/docs
    timeout-minutes: 30
