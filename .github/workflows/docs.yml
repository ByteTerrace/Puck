name: Build API documentation
run-name: API documentation — ${{ github.ref_name }}

# DocFX reads the API projects through Roslyn's MSBuildWorkspace, a design-time build of their sources: it compiles no
# shader (build/Shaders.targets), and docs/api/docfx.json sets PuckApiReference, which leaves out the analyzer reference
# (Directory.Build.props). The site therefore needs nothing the solution build produces, and this producer starts beside
# it (artifacts.yml) rather than after it. It has no CLI, which the solution build compiles, so it runs DocFX with exactly
# the arguments `puck docs build` runs (DocsBuildCommand.DocfxArguments); the application bundle stages the uploaded site
# with `puck docs build --site`.

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: true
  DOTNET_NOLOGO: true

jobs:
  build:
    name: Generate and validate the documentation site
    runs-on: windows-2025
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No NuGet cache: the solution-wide cache measured about three minutes to download and unpack, where this job
      # restores only the API documentation's projects and the docfx tool.
      - name: Install the pinned .NET SDK
        uses: ./.github/actions/setup-dotnet
      - name: Restore the pinned DocFX
        run: dotnet tool restore --configfile nuget.config
      - name: Generate the API reference, failing on any warning
        run: dotnet tool run docfx -- docs/api/docfx.json --warningsAsErrors
      - name: Upload the API documentation site
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: documentation
          path: docs/api/_site
    timeout-minutes: 30
